<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030616"/>
      <stop offset="50%" stop-color="#081539"/>
      <stop offset="100%" stop-color="#14306e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#030616" flood-opacity="0.7"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square with deep blue gradient -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#3b82f6" stroke-width="1">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="160" y1="100" x2="160" y2="412"/>
    <line x1="256" y1="100" x2="256" y2="412"/>
    <line x1="352" y1="100" x2="352" y2="412"/>
  </g>

  <!-- Chart foundation -->
  <path d="M80,360 L160,310 L220,330 L290,250 L350,200 L410,150 L410,420 L80,420 Z"
        fill="url(#chartGrad)" opacity="0.8"/>

  <!-- Chart line (geometric & clean) -->
  <polyline points="80,360 160,310 220,330 290,250 350,200 410,150"
            fill="none" stroke="url(#chipGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- Geometric chart peak indicator (diamond) -->
  <g transform="translate(410, 150)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#22d3ee" transform="rotate(45)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center hex/AI chip -->
  <g transform="translate(256, 200)" filter="url(#softShadow)">
    <!-- Outer hex ring -->
    <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36"
             fill="url(#primaryGrad)" opacity="0.18"/>
    <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36"
             fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6"/>

    <!-- Inner solid hex with gradient -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"
             fill="url(#primaryGrad)" opacity="0.95"/>

    <!-- AI text -->
    <text x="0" y="2" text-anchor="middle" font-family="'Sora', 'Space Grotesk', sans-serif"
          font-size="32" font-weight="800" fill="#fff" letter-spacing="1">AI</text>

    <!-- Pulsing dot -->
    <circle cx="0" cy="-72" r="4" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Brand text at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'Sora', 'Space Grotesk', sans-serif"
        font-size="32" font-weight="800" letter-spacing="3" fill="url(#textGrad)">TRADING</text>
  <text x="256" y="464" text-anchor="middle" font-family="'Sora', 'Space Grotesk', sans-serif"
        font-size="14" font-weight="600" letter-spacing="6" fill="#5a6f99">AGENT</text>

  <!-- Accent lines -->
  <rect x="216" y="478" width="80" height="2" rx="1" fill="url(#primaryGrad)" opacity="0.6"/>

  <!-- Corner accents (modern tech detail) -->
  <g stroke="url(#primaryGrad)" stroke-width="2" opacity="0.5" fill="none">
    <path d="M40,64 L40,40 L64,40"/>
    <path d="M448,40 L472,40 L472,64"/>
    <path d="M472,448 L472,472 L448,472"/>
    <path d="M64,472 L40,472 L40,448"/>
  </g>
</svg>
